{{- if and .Values.imageStore.enabled .Values.imageStore.auth.enabled (not .Values.imageStore.secretRef) }}
{{- $secretName := printf "%s-imagestore-credentials" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: goframe
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: imagestore
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.imageStore.auth.username }}
  username: {{ .Values.imageStore.auth.username | b64enc | quote }}
  {{- else if and $existing $existing.data $existing.data.username }}
  username: {{ $existing.data.username | quote }}
  {{- else }}
  username: {{ "admin" | b64enc | quote }}
  {{- end }}
  {{- if .Values.imageStore.auth.password }}
  password: {{ .Values.imageStore.auth.password | b64enc | quote }}
  {{- else if and $existing $existing.data $existing.data.password }}
  password: {{ $existing.data.password | quote }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
