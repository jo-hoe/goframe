# -- Timezone for image rotation midnight detection (IANA timezone name)
timezone: "UTC"

# RustFS connection configuration.
# Leave address empty to use the bundled RustFS subchart.
# Set address to connect to an external RustFS or MinIO instance instead.
rustfs:
  # -- Base URL of an external RustFS or MinIO instance (e.g. "http://my-rustfs:9000"). Empty = use bundled subchart.
  address: ""
  # -- S3 bucket name. Defaults to the Helm release name when empty.
  bucket: ""
  # -- Name of a Kubernetes Secret with keys `accessKey` and `secretKey`. Auto-created when empty.
  secretRef: ""
  # -- Browser-facing URL prefix for served images. Defaults to "/images" when empty.
  imageBaseURL: ""
  image:
    # -- RustFS container image repository
    repository: rustfs/rustfs
    # -- RustFS container image tag
    tag: "latest"
    # -- Image pull policy for the RustFS container
    pullPolicy: IfNotPresent
  persistence:
    # -- Enable persistent storage for RustFS
    enabled: true
    # -- Persistent volume size. Scale with image_count × avg_size_MB × 1.5.
    size: 1Gi
    # -- StorageClass for the persistent volume. Empty = cluster default.
    storageClass: ""
  credentials:
    # -- RustFS access key. Auto-generated when empty.
    accessKey: ""
    # -- RustFS secret key. Auto-generated when empty.
    secretKey: ""
  ingress:
    # -- Expose RustFS images via Kubernetes Ingress for direct browser access
    enabled: true
    # -- IngressClass name for RustFS ingress. Empty = cluster default.
    className: ""
    # -- Annotations for the RustFS Ingress resource
    annotations: {}

server:
  image:
    # -- goframe server container image repository
    repository: ghcr.io/jo-hoe/goframe
    # -- goframe server image tag. Defaults to the chart appVersion when empty.
    tag: ""
    # -- Image pull policy for the goframe server container
    pullPolicy: IfNotPresent
  # -- Port the goframe server listens on
  port: 8080
  # -- Width in pixels for generated thumbnails
  thumbnailWidth: 512
  # -- Log verbosity level (debug, info, warn, error)
  logLevel: "info"
  # -- Long-side pixel count used when converting SVGs to raster fallbacks
  svgFallbackLongSidePixelCount: 4096
  # -- How the server Service is exposed. Valid values: ClusterIP, NodePort, LoadBalancer.
  serviceType: "ClusterIP"
  # -- Number of goframe server replicas
  replicas: 1
  # -- Maximum number of image processing jobs that run concurrently in the server.
  # Each pipeline job can peak at several hundred MiB of working memory;
  # keep this value low (default: 1) to avoid OOM in memory-constrained pods.
  maxConcurrentProcessing: 1
  # -- Compute resource requests and limits for the server container. Leave empty to set none.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Optional bundled image store app (dufs): a low-footprint file server with a UI
# and HTTP API for browsing/managing images on a PVC. A `dufs` scheduler source
# can pull images from it into goframe. The UI is exposed on the same host(s) as
# the server under a distinct path (default /gallery). Authentication is OFF by
# default: co-hosting a Basic-auth UI with the rustfs S3 endpoint on one hostname
# makes the browser leak the gallery login to /images, which rustfs rejects.
# Enable auth only when the gallery runs on its own hostname.
imageStore:
  # -- Enable the bundled image store app (dufs) for browsing/managing images on a PVC
  enabled: false
  image:
    # -- dufs container image repository
    repository: sigoden/dufs
    # -- dufs image tag
    tag: "v0.47.0"
    # -- Image pull policy for the dufs container
    pullPolicy: IfNotPresent
  # -- Name of a Secret with keys `username` and `password`. Only used when auth.enabled. Auto-created when empty.
  secretRef: ""
  # Authentication for the gallery UI and HTTP API. Disabled by default so the UI
  # and rustfs can safely share a hostname (an enabled Basic-auth login leaks to
  # the rustfs /images S3 endpoint and breaks image serving).
  auth:
    # -- Enable HTTP Basic auth on the image store. Keep false when sharing a host with rustfs.
    enabled: false
    # -- Image store username. Defaults to "admin" when empty. Only used when auth.enabled.
    username: ""
    # -- Image store password. Auto-generated (random) when empty. Only used when auth.enabled.
    password: ""
  # -- Port dufs listens on
  port: 5000
  # -- Subpath dufs serves under (DUFS_PATH_PREFIX). Must match ingress.path.
  pathPrefix: /gallery
  # -- Number of image store replicas
  replicas: 1
  # -- How the image store Service is exposed (ClusterIP, NodePort, LoadBalancer)
  serviceType: ClusterIP
  # -- Compute resource requests and limits for the dufs container. Leave empty to set none.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  persistence:
    # -- Persistent volume size for stored images
    size: 5Gi
    # -- StorageClass for the persistent volume. Empty = cluster default.
    storageClass: ""
    # -- PVC access mode
    accessMode: ReadWriteOnce
  # The gallery UI is exposed on the same host(s) as the server (.Values.ingress.hosts)
  # under a distinct path (default /gallery), with TLS inherited from the server ingress.
  ingress:
    # -- Expose the image store UI via Kubernetes Ingress
    enabled: false
    # -- IngressClass name. Falls back to .Values.ingress.className when empty.
    className: ""
    # -- Annotations for the image store Ingress resource (e.g. cert-manager issuer)
    annotations: {}
    # -- Path on the shared host for the gallery UI. Must match imageStore.pathPrefix.
    path: /gallery

# -- Image processing pipeline applied to every ingested image.
# Supported commands: OrientationCommand, ScaleCommand, PixelScaleCommand,
#                     CropCommand, PngConverterCommand, DitherCommand
# Examples (uncomment to use):
# commands:
#   - name: OrientationCommand
#     params:
#       orientation: portrait
#   - name: ScaleCommand
#     params:
#       height: 1920
#       width: 1080
#   - name: DitherCommand
#     params:
#       ditheringAlgorithm: atkinson
#       palette:
#         - [[0, 0, 0],[25, 30, 33]]
#         - [[255, 255, 255],[232, 232, 232]]
commands: []

# -- Default image used for scheduler CronJobs when no per-scheduler image is specified
schedulerImage:
  # -- Scheduler container image repository
  repository: ghcr.io/jo-hoe/goframe-image-scheduler
  # -- Scheduler image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Image pull policy for the scheduler container
  pullPolicy: IfNotPresent

# -- CronJob-based image schedulers (one CronJob per entry).
# Each entry requires: name, cron, source.
# Supported sources: xkcd, oatmeal, metmuseum, tumblr, s3, dufs, nasaapod, nasaimageoftheday, imagelist.
#
# group: optional. Schedulers sharing the same group evict each other's images on
# a successful upload, so only one group member's image is displayed at a time. Use this to
# stagger different sources across days or time periods.
#
# onExternalImages: optional (default: ignore). Controls what happens when images
# not owned by this scheduler or any group member exist:
#   ignore   — upload normally, leave external images untouched
#   takeover — delete all external images after uploading
#   yield    — delete own images, skip upload
#
# Example — weekday/weekend stagger:
# schedulers:
#   - name: weekday-xkcd
#     cron: "0 8 * * 1-5"
#     source: xkcd
#     group: daily-wallpaper
#     onExternalImages: takeover
#   - name: weekend-tumblr
#     cron: "0 8 * * 6,0"
#     source: tumblr
#     group: daily-wallpaper
#     onExternalImages: ignore
#     tumblr:
#       blogs:
#         - pusheen
#
# Example — tumblr blog:
# schedulers:
#   - name: nasa-tumblr
#     cron: "0 8 * * *"
#     source: tumblr
#     tumblr:
#       blogs:
#         - nasa         # blog name without .tumblr.com
#         - pusheen      # add more blogs to pick from randomly
#
# Example — metmuseum with department filter:
# schedulers:
#   - name: met-daily
#     cron: "0 8 * * *"
#     source: metmuseum
#     metmuseum:
#       # departmentIDs is optional — omit to search all departments.
#       # Available IDs:
#       #   1=American Decorative Arts  3=Ancient West Asian Art  4=Arms and Armor
#       #   5=Arts of Africa, Oceania, and the Americas           6=Asian Art
#       #   7=The Cloisters             8=The Costume Institute   9=Drawings and Prints
#       #   10=Egyptian Art             11=European Paintings     12=European Sculpture
#       #   13=Greek and Roman Art      14=Islamic Art            15=Robert Lehman Collection
#       #   17=Medieval Art             19=Photographs            21=Modern Art
#       departmentIDs:
#         - 6   # Asian Art
#         - 9   # Drawings and Prints
#         - 11  # European Paintings
#
# Example — s3-compatible source (AWS S3, RustFS, MinIO):
# schedulers:
#   - name: s3-daily
#     cron: "0 8 * * *"
#     source: s3
#     s3:
#       endpoint: "https://s3.us-east-1.amazonaws.com"  # or "http://rustfs:9000" for RustFS
#       bucket: "my-images"
#       prefix: "wallpapers/"   # optional; omit to use all objects in the bucket.
#                                # listing is fully recursive — sub-sub-folders are included
#                                # automatically (no S3 delimiter is used).
#       region: "us-east-1"     # any non-empty value for RustFS
#       # secretRef names a Kubernetes Secret with keys "accessKey" and "secretKey".
#       # Omit for anonymous access to public buckets.
#       secretRef: "my-s3-credentials"
#
# Example — dufs source (pull from the bundled image store app or any dufs instance):
# schedulers:
#   - name: dufs-daily
#     cron: "0 8 * * *"
#     source: dufs
#     dufs:
#       # endpoint is the dufs base URL including the path prefix. For the bundled
#       # image store app it is the in-cluster Service + prefix:
#       # "http://<release>-imagestore:5000/gallery".
#       endpoint: "http://<release>-imagestore:5000/gallery"
#       # secretRef names a Kubernetes Secret with keys "username" and "password".
#       # Only needed when imageStore.auth.enabled=true: omit to reuse the bundled
#       # app's auto-created credentials ("<release>-imagestore-credentials").
#       # Omit entirely for an unauthenticated dufs instance (the default).
#       secretRef: "my-imagestore-credentials"
#
# Example — single source with per-scheduler processing pipeline:
# schedulers:
#   - name: xkcd
#     cron: "0 8 * * *"
#     source: xkcd
#     commands:
#       - name: ScaleCommand
#         height: 1600
#         width: 1200
#     image:
#       repository: ghcr.io/jo-hoe/goframe-image-scheduler
#       tag: ""
#       pullPolicy: IfNotPresent
#
# Example — NASA Astronomy Picture of the Day (random image from the full archive):
# schedulers:
#   - name: nasa-apod
#     cron: "0 8 * * *"
#     source: nasaapod
#     nasaapod:
#       # apiKeySecretRef names a Kubernetes Secret with key "apiKey".
#       # Obtain a free key at https://api.nasa.gov/.
#       # Omit to use the NASA demo key (rate-limited to 30 req/hour/IP).
#       apiKeySecretRef: "nasa-apod-credentials"
#
# Example — NASA Image of the Day (latest image from https://www.nasa.gov/image-of-the-day/):
# schedulers:
#   - name: nasa-image-of-the-day
#     cron: "0 8 * * *"
#     source: nasaimageoftheday
#     # No additional configuration required.
#
# Example — imagelist (random image from a provided YAML list of URLs):
# Each list entry has a required `url`; any other fields (title, description,
# credit, altText, publishedAt, width, height, orientation) are ignored.
# The list is always mounted as a file and read at runtime — either from a
# chart-rendered ConfigMap (inline) or a PVC.
# schedulers:
#   - name: natgeo
#     cron: "0 8 * * *"
#     source: imagelist
#     imagelist:
#       # Option A — inline the list; the chart renders a ConfigMap for it:
#       images:
#         - url: https://example.com/a.jpg
#         - url: https://example.com/b.jpg
#           title: Behind the Scenes   # extra fields are ignored
#       # Option B — mount a PersistentVolumeClaim; the claim must contain
#       #            "images.yaml" at the root of the volume. Takes precedence
#       #            over images when set.
#       # pvcRef: natgeo-image-list
#       # headers is optional — HTTP request headers applied to each image download.
#       # Set a browser User-Agent for hosts that reject the default Go client.
#       # headers:
#       #   - name: User-Agent
#       #     value: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
#
schedulers: []

ingress:
  # -- Enable Kubernetes Ingress for the goframe server
  enabled: true
  # -- IngressClass name. Empty = cluster default.
  className: ""
  # -- Annotations for the goframe Ingress resource
  annotations: {}
  # -- Ingress host rules
  hosts:
    - paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration for the goframe Ingress
  tls: []
